# Creators whose streams you may clip.
#
# The pipeline will NOT process a stream unless its channel matches an entry
# here with permission.granted: true and a non-empty permission.source.
#
# `match` is any substring of the channel URL, channel ID or channel name that
# yt-dlp reports for the stream (lowercase compare). Run `clipper check <url>`
# to test a link without downloading.
#
# `language` sets the language Claude writes titles/captions/hashtags in.

creators:
  - id: illojuan
    display_name: "IlloJuan"
    credit: "IlloJuan (twitch.tv/illojuan)"
    language: Spanish
    match:
      - "twitch.tv/illojuan"
      - "illojuan"
    permission:
      granted: true
      source: "Allows clipping of his streams (confirmed by channel owner, 2026-11-11)"
      evidence: ""      # TODO: paste a link/screenshot of where he says clipping is allowed
      terms: ""         # TODO: any conditions (credit format, no monetisation, etc.)
    links:
      description: "Directo completo: https://twitch.tv/illojuan"

  - id: rubius
    display_name: "Rubius"
    credit: "Rubius (twitch.tv/rubius)"
    language: Spanish
    match:
      - "twitch.tv/rubius"
      - "rubius"
    permission:
      granted: true
      source: "Allows clipping of his streams (confirmed by channel owner, 2026-11-11)"
      evidence: ""      # TODO: paste a link/screenshot of where he says clipping is allowed
      terms: ""
    links:
      description: "Directo completo: https://twitch.tv/rubius"

  # English-speaking creator: fill in and set granted: true once you've confirmed permission.
  - id: english_creator
    display_name: "TBD"
    credit: "TBD (twitch.tv/tbd)"
    language: English
    match:
      - "twitch.tv/tbd"
    permission:
      granted: false
      source: ""
      evidence: ""
      terms: ""
    links:
      description: "Full stream: https://twitch.tv/tbd"
