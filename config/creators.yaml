# Creators whose streams you may clip.
#
# The pipeline will NOT process a stream unless its channel matches an entry
# here with permission.granted: true and a non-empty permission.source.
#
# `match` is any substring of the channel URL, channel ID or channel name that
# yt-dlp reports for the stream (lowercase compare). Run `clipper check <url>`
# to test a link without downloading.
#
# `language` sets the language Claude writes titles/captions/hashtags in.

creators:
  - id: illojuan
    display_name: "IlloJuan"
    credit: "IlloJuan (twitch.tv/illojuan)"
    language: Spanish
    # Facecam box as fractions of the frame (x, y = top-left corner). Measured on his GTA stream, Nov 2026.
    # If he moves his camera, re-measure: `clipper frame <stream-url>` saves a screenshot with a grid.
    facecam: {x: 0.027, y: 0.292, w: 0.150, h: 0.275}
    match:
      - "twitch.tv/illojuan"
      - "illojuan"
    permission:
      granted: true
      source: "Allows clipping of his streams (confirmed by channel owner, 2026-11-11)"
      evidence: ""      # TODO: paste a link/screenshot of where he says clipping is allowed
      terms: ""         # TODO: any conditions (credit format, no monetisation, etc.)
    links:
      description: "Directo completo: https://twitch.tv/illojuan"

  - id: rubius
    display_name: "Rubius"
    credit: "Rubius (twitch.tv/rubius)"
    language: Spanish
    # Measured on his 2026-11-10 stream (gameplay scene: cam bottom-left). Re-measure on a GTA 6 stream if it moves.
    facecam: {x: 0.003, y: 0.592, w: 0.222, h: 0.270}
    match:
      - "twitch.tv/rubius"
      - "rubius"
    permission:
      granted: true
      source: "Allows clipping of his streams (confirmed by channel owner, 2026-11-11)"
      evidence: ""      # TODO: paste a link/screenshot of where he says clipping is allowed
      terms: ""
    links:
      description: "Directo completo: https://twitch.tv/rubius"

  - id: xqc
    display_name: "xQc"
    credit: "xQc (kick.com/xqc)"
    language: English
    # Measured on his 2026-11-09 GTA V stream (cam middle-left, chat below it). Re-measure if it moves:
    # `clipper frame <stream-url>`.
    facecam: {x: 0.003, y: 0.305, w: 0.186, h: 0.258}
    match:
      - "twitch.tv/xqc"
      - "kick.com/xqc"
    permission:
      granted: true
      source: "Publicly allows clipping/reuploading of his streams (added by channel owner, 2026-11-11)"
      evidence: ""      # TODO: paste a link to his statement allowing clips
      terms: ""
    links:
      description: "Full stream: https://kick.com/xqc"
