data_dir: data

download:
  max_height: 1080          # source resolution cap (lower = faster)
  chat: true                # pull YouTube live-chat replay when available

highlights:
  candidates: 30            # loudest/hypest windows sent to Claude
  min_gap_seconds: 120      # peaks closer than this are merged
  window_before: 45         # seconds of context before a peak
  window_after: 30
  chat_weight: 0.6          # weighting of chat spikes vs audio spikes
  hype_words: ["lol", "lmao", "lmfao", "omg", "w", "kekw", "clip", "no way", "bro", "😂", "💀", "pog", "insane",
               "jaja", "jajaja", "xd", "xdd", "madre mia", "madre mía", "no puede ser", "illo", "que crack", "qué crack",
               "buah", "brutal", "clipeen", "clipazo", "omegalul"]

llm:
  backend: claude_code      # claude_code = your Claude subscription (no API credits) | api = ANTHROPIC_API_KEY credits
  model: claude-opus-5-5
  effort: high
  claude_path: null         # null = find Claude Code automatically (PATH or the VS Code extension)
  retries: 3
  retry_wait_seconds: 120   # waits longer each retry (e.g. when the plan's usage limit is hit)
  timeout_seconds: 1800

transcription:              # agent 1: whole stream, cached per chunk
  engine: mlx               # mlx = fast on Apple Silicon (M1-M4) | faster-whisper = CPU fallback
  mlx_model: mlx-community/whisper-large-v3-turbo
  chunk_seconds: 600
  model: small              # faster-whisper only: tiny | base | small | medium | large-v3
  device: auto
  compute_type: int8

analysis:                   # agent 2
  shortlist: 16             # moments the scout passes to the editor
  max_clips: 8              # clips kept per stream
  min_seconds: 15
  max_seconds: 45
  frames_per_candidate: 3   # still frames sent to Claude per candidate (0 = text only)

render:
  layout: facecam           # facecam = streamer's camera top + gameplay bottom; stack = gameplay top + your content bottom; blur = gameplay over blurred background
  facecam_height: 840       # facecam layout: height of the camera panel (gameplay gets the rest)
  width: 1080
  height: 1920
  top_height: 1080          # stack layout: height of the gameplay panel
  crop_center_x: 0.5        # 0..1, horizontal crop focus of the 16:9 source
  bottom_dir: assets/bottom # YOUR OWN videos (own gameplay, reactions, licensed b-roll)
  captions: true
  music_lufs: -22           # background music loudness (voice is -14; lower = quieter); ducks further under speech
  caption_words_per_line: 3
  font: "Arial Black"
  crf: 20

schedule:
  interval_hours: 4
  anchor_hour: 0            # slots at 00:00, 04:00, 08:00 ... in timezone below
  timezone: Europe/London
  youtube_upload_ahead_hours: 48   # upload private early with publishAt; YouTube publishes on time even if your Mac is off

platforms:
  youtube:
    enabled: true
    channel_id: UCtEupstFEid-N-o_STg64gg   # uploads are refused if the authorised account is a different channel
    category_id: "20"       # Gaming
    default_tags: ["GTA6", "GTA 6", "Grand Theft Auto VI", "Shorts"]
    made_for_kids: false
  tiktok:
    enabled: false   # on hold until TikTok approves the app
    username: gtauploads5   # posting is refused if the authorised TikTok account is different
    mode: inbox             # inbox = sends to your TikTok drafts (works before audit); direct = publish (needs audited app)
    privacy_level: PUBLIC_TO_EVERYONE
