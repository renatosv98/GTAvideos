# Background music, by mood. All tracks: Kevin MacLeod (incompetech.com), licensed CC BY 4.0:
# free to use on YouTube/TikTok/Instagram, including monetised, AS LONG AS the credit line is in the description
# (the publisher adds it automatically).
#
# `clipper music download` fetches every file into assets/music/. Add your own tracks the same way
# (file must be in assets/music/; set license/credit to what the track's licence requires).
#
# Moods the selector can choose:
#   funny     silly, bouncy, goofy           sneaky    mischievous, cartoon tiptoe
